apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: gitea
  namespace: {{ .Release.Namespace }}
  labels:
    app: gitea
  annotations:
    haproxy.router.openshift.io/timeout: 600s
spec:
  {{- if .Values.gitea.host }}
  host: {{ .Values.gitea.host | quote }}
  {{- end }}
  to:
    kind: Service
    name: gitea
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
