kuadrant:
  namespace: kuadrant-system
  operatorGroup: kuadrant
  name: kuadrant
  subscription:
    name: rhcl-operator
    channel: stable
    installPlanApproval: Automatic
    source: redhat-operators
    sourceNamespace: openshift-marketplace

rhoai:
  namespace: redhat-ods-operator
  subscription:
    name: rhods-operator
    channel: stable-3.x
    installPlanApproval: Automatic
    source: redhat-operators
    sourceNamespace: openshift-marketplace
  modelRegistriesNamespace: rhoai-model-registries
  workbenchNamespace: rhods-notebooks
  components:
    aigateway: Managed
    aipipelines: Managed
    dashboard: Managed
    feastoperator: Removed
    kserve: Removed
    kueue: Removed
    mcplifecycleoperator: Managed
    mlflowoperator: Managed
    modelregistry: Managed
    ogx: Managed
    ray: Removed
    trainer: Removed
    trainingoperator: Removed
    trustyai: Managed
    workbenches: Managed

mcpGateway:
  name: mcp-gateway
  namespace: mcp-gateway
  hostname: mcp.mcp-gateway.svc.cluster.local

MCPServers:
  jiraMcpServer:
    image: ghcr.io/sooperset/mcp-atlassian:latest
    host: http://jira.rhoai-agents-project.svc.cluster.local:8080
    # Jira personal access token. Empty uses per-request Authorization passthrough.
    accessToken: "" 
    env: JIRA_ACCESS_TOKEN
    name: jira-mcp-server
    hint: "Jira MCP Server for searching issues and creating issues"
    namespace: rhoai-agents-project
    port: "8080"
    categories:
      - jira_mcp
      - issue_management
    tools:
      - search_issues
      - create_issue
      - get_issue
  giteaMcpServer:
    image: docker.gitea.com/gitea-mcp-server:1.13.0
    host: http://gitea.rhoai-agents-project.svc.cluster.local:3000
    accessToken: "" 
    env: GITEA_ACCESS_TOKEN
    name: gitea-mcp-server
    hint: "Gitea MCP Server for writing and reading PRs and managing Git repositories"
    namespace: rhoai-agents-project
    port: "8080"
    # spec.category allows at most 3 items. Tool names belong in tags (max 10).
    categories:
      - git_mcp
      - pull_request
      - gitea_mcp
    tools:
      - branch_write
      - create_or_update_file
      - pull_request_write
      - list_pull_requests
      - pull_request_read
      - commit_read
      - get_file_contents
      - pull_request_review_write

certManager:
  namespace: cert-manager-operator
  operatorGroup: openshift-cert-manager-operator
  subscription:
    name: openshift-cert-manager-operator
    channel: stable-v1
    installPlanApproval: Automatic
    source: redhat-operators
    sourceNamespace: openshift-marketplace
  issuer:
    selfSigned: mcp-gateway-selfsigned
    ca: mcp-gateway-ca
  certificate:
    name: default-ingress-cert
    secretName: default-ingress-cert
    # Cluster-specific names, for example mcp-gateway.apps.<cluster>.<base-domain>.
    extraDnsNames: []