# Source: rhoai/templates/mcp-gateway/mcpserver.yaml
apiVersion: mcp.x-k8s.io/v1alpha1
kind: MCPServer
metadata:
  name: gitea-mcp-server
  namespace: rhoai-agents-project
  annotations:
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  source:
    type: ContainerImage
    containerImage:
      ref: docker.gitea.com/gitea-mcp-server:1.13.0
      pullPolicy: IfNotPresent
  config:
    port: 0
    path: /mcp
    arguments:
      - -t
      - http
      - -p
      - "0"
      - -H
      - "http://gitea.rhoai-agents-project.svc.cluster.local:3000"
    storage:
      - path: /tmp
        permissions: ReadWrite
        source:
          type: EmptyDir
          emptyDir:
            sizeLimit: 16Mi
  runtime:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    health:
      readinessProbe:
        httpGet:
          path: /healthz
          port: 0
        periodSeconds: 10
        timeoutSeconds: 3
      livenessProbe:
        httpGet:
          path: /healthz
          port: 0
        periodSeconds: 20
        timeoutSeconds: 3

