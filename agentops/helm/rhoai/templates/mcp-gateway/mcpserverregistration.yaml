{{- range $key, $value := $.Values.MCPServers }}
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPServerRegistration
metadata:
  name: {{ $value.name }}-registration
  namespace: {{ $value.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ $value.name }}
    namespace: {{ $.Values.mcpGateway.namespace }}
  categories:
    {{- range $value.categories }}
    - {{ . }}
    {{- end }}
  hint: {{ $value.hint }}
{{- end }}