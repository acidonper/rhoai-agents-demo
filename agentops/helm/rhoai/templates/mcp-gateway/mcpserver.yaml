{{- range $key, $value := $.Values.MCPServers }}
{{- if $value.accessToken }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $value.name }}
  namespace: {{ $value.namespace }}
  labels:
    app: {{ $value.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "8"
type: Opaque
stringData:
  token: {{ $value.accessToken | quote }}
{{- end }}
---
apiVersion: mcp.x-k8s.io/v1alpha1
kind: MCPServer
metadata:
  name: {{ $value.name }}
  namespace: {{ $value.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  source:
    type: ContainerImage
    containerImage:
      ref: {{ $value.image }}
      pullPolicy: IfNotPresent
  config:
    {{- if $value.args }}
    arguments:
      {{- range $value.args }}
        - {{ . }}
        {{- end }}
    {{- end }}
    port: {{ $value.port | int }}
    path: /mcp
    {{- if $value.accessToken }}
    env:
      - name: {{ $value.env }}
        valueFrom:
          secretKeyRef:
            name: {{ $value.name }}
            key: token
    {{- end }}
    storage:
      - path: /tmp
        permissions: ReadWrite
        source:
          type: EmptyDir
          emptyDir:
            sizeLimit: 16Mi
  runtime:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    health:
      readinessProbe:
        httpGet:
          path: /healthz
          port: {{ $value.port | int }}
        periodSeconds: 10
        timeoutSeconds: 3
      livenessProbe:
        httpGet:
          path: /healthz
          port: {{ $value.port | int }}
        periodSeconds: 20
        timeoutSeconds: 3
{{ end }}