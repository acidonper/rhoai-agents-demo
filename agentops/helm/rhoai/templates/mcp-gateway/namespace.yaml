apiVersion: v1
kind: Namespace
metadata:
  name: {{ $.Values.mcpGateway.namespace }}
  labels:
    argocd.argoproj.io/managed-by: {{ $.Values.gitopsInstance }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    openshift.io/display-name: {{ $.Values.mcpGateway.namespace }}
{{- range $key, $value := $.Values.MCPServers }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $value.namespace }}
  labels:
    argocd.argoproj.io/managed-by: {{ $.Values.gitopsInstance }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    openshift.io/display-name: {{ $value.namespace }}
{{- end }}