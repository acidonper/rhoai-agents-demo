apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $.Values.mcpGateway.name }}
  namespace: {{ $.Values.mcpGateway.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  gatewayClassName: data-science-gateway-class
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: mcps
      hostname: {{ $.Values.mcpGateway.hostname }}
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      hostname: {{ $.Values.mcpGateway.hostname }}
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - group: ''
            kind: Secret
            name: {{ $.Values.certManager.certificate.secretName }}
        mode: Terminate